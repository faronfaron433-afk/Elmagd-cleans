name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android APK from Manifest
        run: |
          mkdir -p android-output
          bubblewrap init --manifest="https://ais-pre-hcfhg4ilpy7ukbw6kqhxn2-756088770342.europe-west2.run.app/manifest.webmanifest" --directory=./twa-project
          cd twa-project
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMajd-Detergents-APK
          path: twa-project/*.apk

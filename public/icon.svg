<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 12" />

  <!-- Detergent Bottle Container -->
  <g filter="url(#shadow)">
    <!-- Bottle Cap / Trigger Pump -->
    <path d="M224 100 L288 100 L288 126 L224 126 Z" fill="#f0fdfa" rx="4" />
    <path d="M244 80 L268 80 L268 100 L244 100 Z" fill="#99f6e4" />
    <!-- Spray nozzle head -->
    <path d="M236 80 C236 68 250 56 268 56 C282 56 320 62 334 76 C344 86 342 98 330 102 L268 102 Z" fill="#5eead4" />
    <!-- Trigger lever -->
    <path d="M292 98 C302 110 306 130 298 144 C292 148 284 142 286 132 C288 122 284 110 278 102 Z" fill="#2dd4bf" />

    <!-- Bottle Neck -->
    <path d="M232 126 L280 126 L292 168 L220 168 Z" fill="#ccfbf1" />

    <!-- Main Bottle Body -->
    <path d="M220 168 C192 184 164 220 164 270 L164 390 C164 416 186 438 212 438 L300 438 C326 438 348 416 348 390 L348 270 C348 220 320 184 292 168 Z" fill="url(#bottleGrad)" />

    <!-- Bottle Label -->
    <rect x="184" y="248" width="144" height="136" rx="16" fill="url(#accentGrad)" />

    <!-- Sparkles on Label -->
    <path d="M256 268 L262 286 L280 292 L262 298 L256 316 L250 298 L232 292 L250 286 Z" fill="#ffffff" />
    
    <!-- Arabic Text "المجد" on Label -->
    <text x="256" y="356" font-family="Arial, 'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">المجد</text>
  </g>

  <!-- Bubbles Floating -->
  <g fill="#a7f3d0" opacity="0.85">
    <circle cx="130" cy="180" r="18" fill="#ffffff" opacity="0.6" stroke="#5eead4" stroke-width="3" />
    <circle cx="110" cy="130" r="12" fill="#ffffff" opacity="0.5" stroke="#5eead4" stroke-width="2" />
    <circle cx="370" cy="160" r="22" fill="#ffffff" opacity="0.7" stroke="#5eead4" stroke-width="3" />
    <circle cx="400" cy="220" r="14" fill="#ffffff" opacity="0.6" stroke="#5eead4" stroke-width="2" />
    <circle cx="365" cy="380" r="12" fill="#ffffff" opacity="0.4" stroke="#5eead4" stroke-width="2" />
    <circle cx="135" cy="340" r="10" fill="#ffffff" opacity="0.4" stroke="#5eead4" stroke-width="2" />
  </g>

  <!-- Big Star / Sparkle top right -->
  <path d="M410 80 L418 105 L443 113 L418 121 L410 146 L402 121 L377 113 L402 105 Z" fill="#fef08a" />
</svg>
